# Mantém a Evolution (Render free) acordada: o plano grátis dorme após 15 min sem tráfego.
# O ping a cada 10 min é feito pelo cron-job.org (o schedule do GitHub não disparava, 2026-11-23); aqui fica só o manual.
# 750 h/mês do plano cobrem um serviço 24/7. Também é o que permite receber as respostas dos leads a qualquer hora.
name: whatsapp-keepalive
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: curl -fsS -m 90 --retry 3 --retry-delay 10 "https://prumo-whatsapp.onrender.com/" -o /dev/null && echo acordado
