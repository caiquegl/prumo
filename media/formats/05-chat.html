<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Manrope,system-ui,sans-serif;background:#0b141a;color:#e9edef;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1080px;height:1920px}
.brand{position:absolute;top:64px;left:48px;z-index:4;font-weight:800;font-size:22px;opacity:.7}
.hook{position:absolute;left:48px;right:48px;top:280px;z-index:3;font-family:Fraunces,serif;font-size:58px;line-height:1.05}
.phone{position:absolute;left:70px;right:70px;top:560px;height:1100px;border-radius:40px;overflow:hidden;background:#0b141a;outline:2px solid rgba(255,255,255,.08);box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
.head{height:120px;background:#1f2c34;display:flex;align-items:center;gap:18px;padding:0 28px}
.av{width:64px;height:64px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-weight:800;color:#0b3d1f;font-size:24px}
.nm{font-size:28px;font-weight:800}.st{font-size:18px;color:#8696a0}
.chat{padding:28px 24px;display:flex;flex-direction:column;gap:18px;background:#0b141a;height:calc(100% - 120px)}
.b{max-width:720px;padding:20px 24px;border-radius:18px;font-size:28px;line-height:1.35;font-weight:600;opacity:0}
.them{align-self:flex-start;background:#1f2c34;border-top-left-radius:4px}
.me{align-self:flex-end;background:#005c4b;border-top-right-radius:4px}
.cta{position:absolute;left:48px;bottom:100px;z-index:5;background:#25d366;color:#0b3d1f;font-weight:800;border-radius:999px;padding:22px 32px;font-size:28px;opacity:0}
</style>
</head>
<body>
<div class="stage">
  <div class="brand">Web Prumo</div>
  <div class="hook" id="h">Se o lead some<br>no Direct…</div>
  <div class="phone">
    <div class="head"><div class="av">WP</div><div><div class="nm">Web Prumo</div><div class="st">online</div></div></div>
    <div class="chat">
      <div class="b them" id="m1">Oi, quanto custa um site?</div>
      <div class="b them" id="m2">vi o Instagram de vocês</div>
      <div class="b me" id="m3">Orçamento no WhatsApp com escopo fechado.</div>
      <div class="b me" id="m4">7 a 15 dias. Sem surpresa.</div>
    </div>
  </div>
  <div class="cta" id="c">Chama: (11) 96633-1995</div>
</div>
<script>
const clamp=v=>Math.min(1,Math.max(0,v));
const seg=(t,a,b)=>clamp((t-a)/Math.max(.001,b-a));
const e=p=>1-Math.pow(1-p,3);
const show=(id,t,a)=>{const el=document.getElementById(id);const p=e(seg(t,a,a+.4));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*14}px)`};
window.render=t=>{
  document.getElementById('h').style.opacity=String(Math.max(.15,1-e(seg(t,4,5.2))));
  show('m1',t,1.2);show('m2',t,2.8);show('m3',t,5.0);show('m4',t,6.8);
  document.getElementById('c').style.opacity=e(seg(t,10.2,11.4));
};
window.__ready=true;window.render(0);
</script>
</body>
</html>
