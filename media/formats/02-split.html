<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Manrope,system-ui,sans-serif;background:#0e0d0c;color:#f6f1ea;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1080px;height:1920px}
.brand{position:absolute;top:64px;left:48px;z-index:8;font-weight:800;font-size:24px;display:flex;gap:10px;align-items:center}
.brand i{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#222;display:block}
.brand img{width:100%;height:100%;object-fit:cover}
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.left{left:0;background:#d9d3c8;color:#2a2622}
.right{right:0}
.right img{width:100%;height:100%;object-fit:cover;object-position:center}
.ugly{padding:220px 28px 80px;display:flex;flex-direction:column;gap:16px;height:100%}
.ugly .logo{font-size:18px;font-weight:800;opacity:.55;letter-spacing:.08em}
.ugly .title{font-family:Arial,Helvetica,sans-serif;font-size:42px;font-weight:700;line-height:1.1;color:#444}
.ugly .box{background:#eee;border:2px dashed #aaa;border-radius:8px;height:120px;display:grid;place-items:center;color:#888;font-size:20px}
.ugly .btn{margin-top:8px;background:#3366cc;color:#fff;text-align:center;padding:16px;border-radius:4px;font-size:22px;font-family:Arial,sans-serif}
.label{position:absolute;top:140px;font-weight:800;letter-spacing:.18em;font-size:20px;text-transform:uppercase;z-index:4}
.l1{left:36px;color:#c45a48}.l2{right:36px;color:#7dcea0}
.hook{position:absolute;left:48px;right:48px;top:300px;z-index:5;font-family:Fraunces,serif;font-size:56px;line-height:1.02;text-shadow:0 8px 28px rgba(0,0,0,.55)}
.wipe{position:absolute;inset:0;background:#0e0d0c;transform-origin:right;z-index:3;pointer-events:none}
.cta{position:absolute;left:48px;bottom:110px;z-index:6;background:#25d366;color:#0b3d1f;font-weight:800;border-radius:999px;padding:20px 30px;font-size:26px;opacity:0}
</style>
</head>
<body>
<div class="stage">
  <div class="brand"><i><img src="file:///home/hitss/prumo/public/ig/logo.jpg"/></i>Web Prumo</div>
  <div class="half left">
    <div class="ugly">
      <div class="logo">MEU SITE.COM</div>
      <div class="title">Bem-vindo ao nosso site oficial</div>
      <div class="box">[ imagem genérica ]</div>
      <div class="box">Lorem ipsum dolor sit amet</div>
      <div class="btn">Clique aqui</div>
    </div>
    <div class="label l1">ANTES</div>
  </div>
  <div class="half right" id="r">
    <img src="file:///home/hitss/prumo/public/ig/prumo-feed-15-pata.jpg"/>
    <div class="label l2">DEPOIS</div>
  </div>
  <div class="wipe" id="w"></div>
  <div class="hook" id="h">Template genérico<br>vs cara de marca.</div>
  <div class="cta" id="c">WhatsApp · 96633-1995</div>
</div>
<script>
const clamp=v=>Math.min(1,Math.max(0,v));
const seg=(t,a,b)=>clamp((t-a)/Math.max(.001,b-a));
const e=p=>1-Math.pow(1-p,3);
window.render=t=>{
  document.getElementById('w').style.transform=`scaleX(${1-e(seg(t,1.0,2.8))})`;
  document.getElementById('h').style.opacity=String(Math.max(.25,1-e(seg(t,8.5,10))));
  document.getElementById('c').style.opacity=e(seg(t,10.5,11.8));
};
window.__ready=true;window.render(0);
</script>
</body>
</html>
