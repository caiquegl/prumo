<!doctype html><html><head><meta charset=utf-8><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:#12110f;color:#f3eee6}
.stage{position:relative;width:1080px;height:1920px;padding:260px 64px}
.k{font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#e88978;font-weight:800}
.num{margin-top:24px;font-family:Fraunces,serif;font-size:180px;line-height:.85;color:#f0b2a6}
.lab{margin-top:12px;font-size:36px;font-weight:700}
.bar{margin-top:80px;height:28px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;width:80%;background:linear-gradient(90deg,#c45a48,#e88978);border-radius:99px}
.note{margin-top:48px;font-size:34px;line-height:1.35;max-width:880px;color:rgba(243,238,230,.75);font-weight:700}
.cta{position:absolute;left:64px;bottom:140px;background:#25d366;color:#0b3d1f;font-weight:800;border-radius:999px;padding:22px 32px;font-size:28px;opacity:0}
.brand{position:absolute;top:72px;left:64px;font-weight:800;font-size:24px}
</style></head><body><div class=stage>
<div class=brand>Web Prumo</div>
<div class=k>PERFORMANCE</div>
<div class=num id=n>4,8s</div>
<div class=lab id=l>site comum</div>
<div class=bar><div class=fill id=f></div></div>
<div class=note id=note>Mais da metade desiste depois de 3 segundos.</div>
<div class=cta id=c>Manda o link no WhatsApp</div>
</div><script>
const clamp=v=>Math.min(1,Math.max(0,v));const seg=(t,a,b)=>clamp((t-a)/Math.max(.001,b-a));const e=p=>1-Math.pow(1-p,3);
window.render=t=>{const flip=t>5.5;document.getElementById('n').textContent=flip?'0,9s':'4,8s';
document.getElementById('l').textContent=flip?'site enxuto':'site comum';
document.getElementById('f').style.width=(flip?18:80)+'%';
document.getElementById('f').style.background=flip?'linear-gradient(90deg,#1faa59,#6dffb0)':'linear-gradient(90deg,#c45a48,#e88978)';
document.getElementById('note').textContent=flip?'Página no ar em menos de 1 segundo. Lead ainda ali.':'Mais da metade desiste depois de 3 segundos.';
document.getElementById('c').style.opacity=e(seg(t,10,11.2));};
window.__ready=true;window.render(0);
</script></body></html>
