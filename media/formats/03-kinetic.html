<!doctype html><html><head><meta charset=utf-8><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:#c45a48;color:#fff7f2}
.stage{position:relative;width:1080px;height:1920px;padding:280px 64px}
.line{font-family:Fraunces,serif;font-weight:500;font-size:110px;line-height:.92;letter-spacing:-.04em;opacity:0}
.sub{margin-top:40px;font-size:36px;font-weight:700;opacity:0;max-width:860px}
.brand{position:absolute;top:72px;left:64px;font-weight:800;font-size:24px;opacity:.9}
.tag{position:absolute;top:72px;right:64px;font-size:18px;letter-spacing:.2em;font-weight:800}
.cta{position:absolute;left:64px;bottom:140px;background:#141210;color:#fff7f2;font-weight:800;border-radius:999px;padding:22px 32px;font-size:28px;opacity:0}
</style></head><body><div class=stage>
<div class=brand>Web Prumo</div><div class=tag>SEND</div>
<div class=line id=a>Direct</div>
<div class=line id=b>cheio.</div>
<div class=line id=c style="margin-top:28px">Site</div>
<div class=line id=d>mudo.</div>
<div class=sub id=s>O lead some no Instagram.</div>
<div class=cta id=x>Qual dos dois você tem? · WhatsApp</div>
</div><script>
const clamp=v=>Math.min(1,Math.max(0,v));const seg=(t,a,b)=>clamp((t-a)/Math.max(.001,b-a));const e=p=>1-Math.pow(1-p,3);
const show=(id,t,a,b)=>{const el=document.getElementById(id);const p=e(seg(t,a,b));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*40}px)`};
window.render=t=>{show('a',t,0,.4);show('b',t,.35,.75);show('c',t,1.1,1.5);show('d',t,1.45,1.85);show('s',t,2.4,3);show('x',t,4.2,5);
if(t>6.5) document.body.style.background='#141210';
else document.body.style.background='#c45a48';};
window.__ready=true;window.render(0);
</script></body></html>
