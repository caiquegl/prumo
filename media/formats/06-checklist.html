<!doctype html><html><head><meta charset=utf-8><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:#f3eee6;color:#141210}
.stage{position:relative;width:1080px;height:1920px;padding:120px 64px}
.brand{font-weight:800;font-size:26px;display:flex;gap:12px;align-items:center}
.brand i{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#111;display:block}
.brand img{width:100%;height:100%;object-fit:cover}
.k{margin-top:36px;font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:#c45a48;font-weight:800}
h1{margin-top:14px;font-family:Fraunces,serif;font-size:64px;line-height:.98;letter-spacing:-.03em}
.list{margin-top:48px;display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:22px;align-items:center;opacity:0;background:#fff;border-radius:22px;padding:22px 26px;box-shadow:0 18px 40px -28px rgba(0,0,0,.35)}
.box{width:54px;height:54px;border-radius:14px;border:3px solid #c45a48;display:grid;place-items:center;font-size:28px;font-weight:800;color:#c45a48}
.box.on{background:#c45a48;color:#fff;border-color:#c45a48}
.row b{font-size:32px}
.cta{position:absolute;left:64px;bottom:120px;background:#25d366;color:#0b3d1f;font-weight:800;border-radius:999px;padding:22px 32px;font-size:28px;opacity:0}
</style></head><body><div class=stage>
<div class=brand><i><img src="file:///home/hitss/prumo/public/ig/logo.jpg"></i>Web Prumo</div>
<div class=k>SAVE · CHECKLIST</div>
<h1>Sua landing<br>tem os 6?</h1>
<div class=list id=list></div>
<div class=cta id=c>Salva e confere a sua</div>
</div><script>
const items=['Promessa clara','Botão acima da dobra','Prova social','WhatsApp à vista','Velocidade < 1s','Métrica de contato'];
const list=document.getElementById('list');
list.innerHTML=items.map((t,i)=>`<div class=row data-i=${i}><div class=box id=b${i}></div><b>${t}</b></div>`).join('');
const clamp=v=>Math.min(1,Math.max(0,v));const seg=(t,a,b)=>clamp((t-a)/Math.max(.001,b-a));const e=p=>1-Math.pow(1-p,3);
window.render=t=>{[...list.children].forEach((row,i)=>{const start=1.2+i*.7;const p=e(seg(t,start,start+.4));row.style.opacity=p;row.style.transform=`translateX(${(1-p)*40}px)`;
const box=document.getElementById('b'+i); if(t>start+.35){box.classList.add('on');box.textContent='✓';} else {box.classList.remove('on');box.textContent='';}});
document.getElementById('c').style.opacity=e(seg(t,12,13));};
window.__ready=true;window.render(0);
</script></body></html>
