<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<!-- Compositor dos Reels faceless (semana 1). Roteiros: content/reels-faceless-semana-01.md. Render: render.mjs (?r=1..4, window.render(t)). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #1a1917; --cream: #f3eee6; --coral: #c45a48; --coral-2: #e88978; --muted: #6f6a63; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); font-family: Manrope, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(70% 45% at 50% 30%, #fbf8f3, var(--cream)); }
  .layer { position: absolute; inset: 0; opacity: 0; }

  /* celular */
  .phone { position: absolute; left: 150px; top: 250px; width: 780px; height: 1560px; border-radius: 72px; background: #0e0d0c; padding: 18px; box-shadow: 0 60px 120px -50px rgba(26,25,23,.55), 0 0 0 2px rgba(26,25,23,.08); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 56px; overflow: hidden; background: #fff; }
  .screen > img.shot { position: absolute; left: 0; top: 0; width: 100%; height: auto; will-change: transform; }
  .island { position: absolute; top: 22px; left: 50%; width: 190px; height: 50px; margin-left: -95px; border-radius: 30px; background: #0e0d0c; z-index: 9; }

  /* busca genérica (sem marca do Google) */
  .search { position: absolute; inset: 0; background: #fff; font-family: Manrope, sans-serif; }
  .s-bar { position: absolute; left: 34px; right: 34px; top: 110px; height: 96px; border-radius: 48px; background: #f1f1f1; display: flex; align-items: center; gap: 18px; padding: 0 32px; font-size: 32px; font-weight: 600; color: #222; }
  .s-bar svg { flex: none; }
  .caret { display: inline-block; width: 3px; height: 38px; background: #222; margin-left: 2px; vertical-align: -6px; }
  .s-map { position: absolute; left: 0; right: 0; top: 240px; height: 380px; background:
      linear-gradient(90deg, transparent 49.6%, #fff 49.6% 50.4%, transparent 50.4%) 0 0 / 160px 100%,
      linear-gradient(0deg, transparent 47%, #fff 47% 53%, transparent 53%) 0 0 / 100% 140px, #e8eee4; }
  .s-pin { position: absolute; width: 54px; height: 54px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--coral); box-shadow: 0 8px 16px rgba(0,0,0,.25); }
  .s-card { position: absolute; left: 24px; right: 24px; border-radius: 34px; background: #fff; box-shadow: 0 16px 50px -18px rgba(0,0,0,.35); padding: 34px 34px 30px; }
  .s-name { font-size: 44px; font-weight: 800; letter-spacing: -.01em; }
  .s-cat { font-size: 28px; color: #666; margin-top: 6px; font-weight: 500; }
  .s-rate { font-size: 30px; margin-top: 14px; font-weight: 700; color: #333; display: flex; align-items: center; gap: 10px; }
  .s-rate i { color: #f2a900; font-style: normal; letter-spacing: 2px; }
  .s-open { font-size: 27px; margin-top: 8px; color: #1e8e3e; font-weight: 600; }
  .s-btns { display: flex; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .s-btn { border: 2px solid #d9d9d9; border-radius: 40px; padding: 14px 26px; font-size: 27px; font-weight: 700; color: #1a5fb4; background: #fff; }
  .s-btn.hot { background: #1a5fb4; color: #fff; border-color: #1a5fb4; }
  .ring { position: absolute; border: 6px solid var(--coral); border-radius: 46px; box-shadow: 0 0 0 10px rgba(196,90,72,.18); pointer-events: none; }

  /* perfil genérico (sem marca do Instagram) */
  .feed { position: absolute; inset: 0; background: #fff; }
  .f-head { position: absolute; left: 0; right: 0; top: 96px; padding: 0 36px; display: flex; gap: 26px; align-items: center; }
  .f-av { width: 150px; height: 150px; border-radius: 50%; background: #111; color: #f6c803; display: grid; place-items: center; font: 800 52px Manrope; box-shadow: 0 0 0 5px #fff, 0 0 0 9px #e3e3e3; flex: none; }
  .f-stats { display: flex; gap: 34px; font-size: 26px; color: #555; }
  .f-stats b { display: block; font-size: 34px; color: #111; }
  .f-bio { position: absolute; left: 36px; right: 36px; top: 280px; font-size: 27px; line-height: 1.4; color: #222; }
  .f-grid { position: absolute; left: 0; right: 0; top: 440px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; will-change: transform; }
  .f-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .f-q { position: absolute; left: 36px; right: 36px; bottom: 60px; border-radius: 28px; background: #111; color: #fff; padding: 26px 30px; font-size: 28px; font-weight: 700; }

  /* chat genérico */
  .chat { position: absolute; inset: 0; background: #ece5dd; }
  .c-top { position: absolute; left: 0; right: 0; top: 0; height: 190px; background: #0f5e54; color: #fff; display: flex; align-items: flex-end; gap: 22px; padding: 0 34px 28px; font-size: 34px; font-weight: 800; }
  .c-top i { width: 76px; height: 76px; border-radius: 50%; background: #111; color: #f6c803; display: grid; place-items: center; font: 800 28px Manrope; font-style: normal; }
  .c-bubble { position: absolute; right: 34px; max-width: 560px; border-radius: 26px 26px 6px 26px; background: #d9fdd3; padding: 24px 28px 18px; font-size: 30px; line-height: 1.38; box-shadow: 0 2px 2px rgba(0,0,0,.08); }
  .c-bubble small { display: block; text-align: right; font-size: 21px; color: #667; margin-top: 8px; }
  .c-input { position: absolute; left: 24px; right: 24px; bottom: 36px; height: 96px; border-radius: 48px; background: #fff; display: flex; align-items: center; padding: 0 34px; font-size: 28px; color: #888; }

  /* textos sobrepostos (área segura: y 250–1570) */
  .cap { position: absolute; left: 70px; right: 70px; top: 300px; z-index: 20; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .cap.mid { top: 820px; }
  .cap.low { top: 1240px; }
  .cap span { display: inline-block; background: var(--ink); color: var(--cream); font: 800 62px/1.08 Manrope; letter-spacing: -.02em; padding: 14px 26px 18px; border-radius: 18px; box-shadow: 0 24px 50px -20px rgba(0,0,0,.5); }
  .cap span.hl { background: var(--coral); color: #fff; }
  .cap span.lite { background: var(--cream); color: var(--ink); }
  .cap span.sm { font-size: 46px; }

  /* telas cheias */
  .full { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .black { background: #0e0d0c; }
  .counter { font: 800 230px/1 Fraunces, serif; letter-spacing: -.04em; color: var(--ink); }
  .counter small { display: block; font: 700 58px Manrope; color: var(--coral); margin-top: 24px; letter-spacing: 0; }
  .checks { position: absolute; left: 90px; right: 90px; top: 520px; display: grid; gap: 22px; z-index: 21; }
  .checks div { display: flex; gap: 22px; align-items: center; background: #fff; border-radius: 26px; padding: 26px 30px; font: 800 46px Manrope; box-shadow: 0 20px 40px -24px rgba(0,0,0,.4); }
  .checks div b { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #1e8e3e; color: #fff; display: grid; place-items: center; font-size: 38px; }
  .dim { position: absolute; inset: 0; background: rgba(243,238,230,.82); z-index: 19; }
  .split { position: absolute; inset: 0; }
  .split .side { position: absolute; top: 330px; width: 470px; height: 1000px; border-radius: 44px; overflow: hidden; background: #fff; box-shadow: 0 40px 80px -40px rgba(0,0,0,.5); border: 10px solid #0e0d0c; }
  .split .side img { width: 100%; display: block; }
  .split .l { left: 50px; transform: rotate(-3deg); }
  .split .r { right: 50px; transform: rotate(3deg); }
  .arrow { position: absolute; left: 50%; top: 790px; width: 140px; height: 140px; margin-left: -70px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font: 800 80px Manrope; z-index: 5; box-shadow: 0 20px 40px -10px rgba(196,90,72,.6); }
  .tag { position: absolute; font: 800 40px Manrope; background: var(--ink); color: var(--cream); padding: 10px 22px; border-radius: 14px; }
  .dots { display: flex; gap: 30px; justify-content: center; }
  .dots i { width: 150px; height: 150px; border-radius: 50%; display: block; box-shadow: 0 20px 40px -18px rgba(0,0,0,.45); }
  .spec { font: 600 260px/1 Fraunces, serif; color: #371456; margin-top: 40px; }
  .url { display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 60px; padding: 34px 50px; font: 700 50px Manrope; box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); }
  .url svg { flex: none; }
  .brand { position: absolute; left: 0; right: 0; bottom: 380px; text-align: center; font: 800 34px Manrope; color: var(--muted); letter-spacing: .02em; z-index: 30; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const R = Number(new URLSearchParams(location.search).get("r") || 1);
const A = "assets/";
const DEMO = "/demos-public/brands/";
const clamp = (v) => Math.min(1, Math.max(0, v));
const seg = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const eo = (p) => 1 - Math.pow(1 - p, 3);
const io = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const stage = document.getElementById("stage");
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };

const MAG = `<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`;
const LOCK = `<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1e8e3e" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const STARS = "★★★★★";

/* ---------- blocos de tela ---------- */
function phone(inner) {
  return `<div class="phone"><div class="screen">${inner}<div class="island"></div></div></div>`;
}
function searchUI(id, query, cards) {
  const cs = cards.map((c, i) => `
    <div class="s-card" id="${id}-c${i}" style="top:${c.top}px">
      <div class="s-name">${c.name}</div>
      <div class="s-cat">${c.cat}</div>
      <div class="s-rate">${c.rate} <i>${STARS}</i> <span style="color:#777;font-weight:600">(${c.n})</span></div>
      <div class="s-open">Aberto · fecha às 18h</div>
      <div class="s-btns">${c.btns.map((b) => `<span class="s-btn ${b.hot ? "hot" : ""}" data-b="${b.t}">${b.t}</span>`).join("")}</div>
    </div>`).join("");
  return `<div class="search" id="${id}">
    <div class="s-bar">${MAG}<span id="${id}-q"></span><span class="caret" id="${id}-caret"></span></div>
    <div class="s-map"><div class="s-pin" style="left:360px;top:150px"></div><div class="s-pin" style="left:180px;top:240px;background:#8a8a8a"></div><div class="s-pin" style="left:560px;top:90px;background:#8a8a8a"></div></div>
    ${cs}
    <div style="position:absolute;left:24px;right:24px;top:1010px;display:grid;gap:26px;opacity:.55">
      ${[0,1,2].map(() => `<div style="border-radius:30px;background:#f4f4f4;height:150px;padding:28px 30px"><div style="width:55%;height:30px;border-radius:8px;background:#e2e2e2"></div><div style="width:35%;height:22px;border-radius:8px;background:#e8e8e8;margin-top:18px"></div><div style="width:45%;height:22px;border-radius:8px;background:#e8e8e8;margin-top:12px"></div></div>`).join("")}
    </div>
  </div>`;
}
function feedUI(id, name, handleBio, ini = "SB") {
  const imgs = Array.from({ length: 36 }, (_, i) => `<img src="${A}feed-${i % 9}.jpg" />`).join("");
  return `<div class="feed" id="${id}">
    <div class="f-head"><div class="f-av">${ini}</div><div class="f-stats"><div><b>212</b>posts</div><div><b>1.240</b>seguidores</div><div><b>380</b>seguindo</div></div></div>
    <div class="f-bio"><b>${name}</b><br>${handleBio}</div>
    <div class="f-grid" id="${id}-g">${imgs}</div>
  </div>`;
}
function chatUI(id, name, msg) {
  return `<div class="chat" id="${id}"><div class="c-top"><i>SB</i>${name}</div>
    <div class="c-bubble" id="${id}-b" style="top:300px">${msg}<small>15:42 ✓✓</small></div>
    <div class="c-input">Mensagem</div></div>`;
}
function shot(id, src) {
  return `<img class="shot" id="${id}" src="${src}" />`;
}
function cap(lines, pos = "") {
  return `<div class="cap ${pos}">${lines.map((l) => `<span class="${l.c || ""}">${l.t}</span>`).join("")}</div>`;
}

/* ---------- linha do tempo genérica ---------- */
const scenes = []; // {from,to,node,fadeIn,fadeOut,anim(t,local)}
function add(from, to, html, anim, opts = {}) {
  const node = el(`<div class="layer">${html}</div>`);
  stage.appendChild(node);
  scenes.push({ from, to, node, anim, fi: opts.fi ?? 0.25, fo: opts.fo ?? 0.25, pop: opts.pop });
  return node;
}
function capAt(from, to, lines, pos) {
  return add(from, to, cap(lines, pos), (t, k, n) => {
    const p = eo(seg(t, from, from + 0.35));
    n.querySelectorAll("span").forEach((s, i) => {
      const q = eo(seg(t, from + i * 0.12, from + i * 0.12 + 0.35));
      s.style.transform = `translateY(${(1 - q) * 40}px) scale(${0.96 + q * 0.04})`;
      s.style.opacity = q;
    });
  }, { fi: 0.05, fo: 0.2 });
}
function typeInto(t, a, b, id, text) {
  const n = Math.round(seg(t, a, b) * text.length);
  const q = document.getElementById(id + "-q");
  if (q) q.textContent = text.slice(0, n);
  const c = document.getElementById(id + "-caret");
  if (c) c.style.opacity = Math.floor(t * 2.5) % 2 || t < b ? 1 : 0;
}

/* ---------- REEL 1 · Pesquisei no Google (24 s) ---------- */
function reel1() {
  const Q = "estética automotiva perto de mim";
  add(0, 7.2, phone(searchUI("s1", Q, [{ top: 560, name: "Studio Brilho", cat: "Estética automotiva · Vila Formosa", rate: "5,0", n: 34, btns: [{ t: "Rota" }, { t: "Ligar" }, { t: "Instagram" }, { t: "Salvar" }] }])), (t) => {
    typeInto(t, 0.2, 2.2, "s1", Q);
    const c = document.getElementById("s1-c0");
    const p = eo(seg(t, 2.6, 3.2));
    c.style.transform = `translateY(${(1 - p) * 300}px)`; c.style.opacity = p;
    const r = document.getElementById("r1-ring");
    r.style.opacity = seg(t, 4.2, 4.5);
    const tap = seg(t, 6.6, 7.0);
    c.querySelector('[data-b="Instagram"]').classList.toggle("hot", tap > 0);
  }, { fi: 0 });
  // círculo no lugar onde "deveria" estar o botão Site
  add(4.0, 7.2, `<div class="ring" id="r1-ring" style="left:186px;top:1092px;width:708px;height:96px"></div>`, () => {}, { fi: 0.1 });
  add(7.0, 10.2, phone(feedUI("f1", "Studio Brilho", "Estética automotiva · Vila Formosa<br>Orçamento pelo direct")), (t) => {
    document.getElementById("f1-g").style.transform = `translateY(${-io(seg(t, 7.4, 10.1)) * 900}px)`;
  });
  add(10.0, 10.5, `<div class="full black"></div>`, () => {}, { fi: 0, fo: 0 });
  add(10.4, 13.3, phone(shot("l1h", A + "lk-hero.png")), (t, k, n) => {
    const p = eo(seg(t, 10.4, 11.0));
    n.querySelector(".phone").style.transform = `scale(${0.92 + 0.08 * p})`;
    document.getElementById("l1h").style.transform = `translateY(${-io(seg(t, 11.6, 13.2)) * 120}px)`;
  }, { fi: 0.15 });
  add(13.2, 15.6, phone(shot("l1p0", A + "lk-pick-0.png")), (t) => {}, {});
  add(15.5, 18.2, phone(shot("l1p2", A + "lk-pick-2.png")), (t) => {
    document.getElementById("l1p2").style.transform = `translateY(${-io(seg(t, 16.2, 17.8)) * 60}px)`;
  }, {});
  add(18.1, 21.2, phone(chatUI("c1", "Studio Brilho", "Olá! Vi a página do Studio Brilho e quero agendar: Polimento de farol.")), (t) => {
    const b = document.getElementById("c1-b");
    const p = eo(seg(t, 18.6, 19.2));
    b.style.transform = `translateY(${(1 - p) * 60}px) scale(${0.9 + 0.1 * p})`; b.style.opacity = p;
  });
  add(21.1, 24.0, phone(searchUI("s1b", Q, [])), (t) => {
    document.getElementById("s1b-q").textContent = Q;
  }, { fo: 0 });

  capAt(0.0, 2.6, [{ t: "Pesquisei" }, { t: "“estética automotiva”", c: "hl" }, { t: "no Google…" }], "mid");
  capAt(3.2, 7.0, [{ t: "nota 5,0 ★" }, { t: "…e nenhum site", c: "hl" }], "low");
  capAt(7.4, 10.0, [{ t: "só o Instagram" }, { t: "pra saber preço, tem que caçar", c: "sm lite" }], "low");
  capAt(10.6, 13.2, [{ t: "então eu fiz" }, { t: "a página dela", c: "hl" }], "low");
  capAt(13.4, 18.0, [{ t: "o cliente escolhe" }, { t: "o serviço…", c: "hl" }], "low");
  capAt(18.2, 21.0, [{ t: "…e já cai no WhatsApp", c: "hl" }, { t: "com a mensagem pronta", c: "sm lite" }], "low");
  capAt(21.2, 24.0, [{ t: "seu negócio também" }, { t: "só tem Instagram?" }, { t: "comenta SITE", c: "hl" }], "mid");
  return { dur: 24, cover: 1.7 };
}

/* ---------- REEL 2 · O botão "Site" (20 s) ---------- */
function reel2() {
  const Q = "estética automotiva vila formosa";
  const cards = [
    { top: 560, name: "Auto Spa Prime", cat: "Estética automotiva", rate: "4,9", n: 61, btns: [{ t: "Site" }, { t: "Rota" }, { t: "Ligar" }] },
  ];
  add(0, 3.3, phone(searchUI("s2", Q, cards)), (t) => {
    document.getElementById("s2-q").textContent = Q;
    document.getElementById("s2-caret").style.opacity = 0;
    const s = document.querySelector('#s2-c0 [data-b="Site"]');
    s.classList.toggle("hot", t > 2.6);
    const z = io(seg(t, 0.3, 2.4));
    stage.querySelector("#s2").style.transform = `scale(${1 + z * 0.35})`;
    stage.querySelector("#s2").style.transformOrigin = "18% 66%";
  }, { fi: 0 });
  add(3.2, 8.9, phone(feedUI("f2", "Auto Spa Prime", "Estética automotiva · orçamento pelo direct", "AP")), (t) => {
    document.getElementById("f2-g").style.transform = `translateY(${-io(seg(t, 3.6, 8.8)) * 1800}px)`;
  });
  add(8.8, 11.9, phone(searchUI("s3", Q, [{ top: 560, name: "Lava Jato Central", cat: "Estética automotiva", rate: "4,8", n: 22, btns: [{ t: "Rota" }, { t: "Ligar" }, { t: "Salvar" }] }])), (t) => {
    document.getElementById("s3-q").textContent = Q;
    document.getElementById("s3-caret").style.opacity = 0;
  });
  add(9.6, 11.9, `<div class="ring" style="left:186px;top:1092px;width:708px;height:96px"></div>`, () => {}, { fi: 0.1 });
  add(11.8, 15.0, phone(searchUI("s4", Q, [{ top: 560, name: "Studio Brilho", cat: "Estética automotiva", rate: "5,0", n: 34, btns: [{ t: "Site", hot: true }, { t: "Rota" }, { t: "Ligar" }] }])), (t, k, n) => {
    document.getElementById("s4-q").textContent = Q;
    document.getElementById("s4-caret").style.opacity = 0;
    const p = eo(seg(t, 13.2, 14.6));
    n.querySelector(".search").style.transform = `translateY(${-p * 1600}px)`;
  });
  add(13.4, 15.0, phone(shot("l2h", A + "lk-hero.png")), (t) => {
    document.getElementById("l2h").style.transform = `translateY(${(1 - eo(seg(t, 13.2, 14.6))) * 1600}px)`;
  }, { fi: 0 });
  add(14.9, 20.0, phone(shot("l2p", A + "lk-pick-0b.png")), (t) => {
    document.getElementById("l2p").style.transform = `translateY(${-io(seg(t, 15.4, 19.6)) * 80}px)`;
  }, { fo: 0 });

  capAt(0.0, 3.2, [{ t: "Pra onde leva" }, { t: "o botão “Site”", c: "hl" }, { t: "do seu Google?" }], "low");
  capAt(3.4, 6.0, [{ t: "se for pro Instagram…" }], "low");
  capAt(6.0, 8.8, [{ t: "o cliente precisa" }, { t: "caçar a informação", c: "hl" }], "low");
  capAt(9.0, 11.8, [{ t: "se não tiver nada…" }], "low");
  capAt(12.0, 14.9, [{ t: "…ele clica no concorrente", c: "hl" }], "low");
  capAt(15.0, 20.0, [{ t: "uma página resolve." }, { t: "comenta SITE", c: "hl" }], "low");
  return { dur: 20, cover: 1.2 };
}

/* ---------- REEL 3 · Da ficha ao site em 7 dias (28 s) ---------- */
function reel3() {
  const fichaHTML = searchUI("s5", "buffet infantil santo andré", [{ top: 560, name: "Doce Festa", cat: "Estações de comida para festas", rate: "5,0", n: 15, btns: [{ t: "Rota" }, { t: "Instagram" }] }]);
  const splitHTML = (id) => `<div class="split" id="${id}">

window.render = (t) => {
  for (const s of scenes) {
    const vis = t >= s.from && t < s.to;
    let o = 0;
    if (vis) {
      const fi = s.fi ? seg(t, s.from, s.from + s.fi) : 1;
      const fo = s.fo ? 1 - seg(t, s.to - s.fo, s.to) : 1;
      o = Math.min(fi, fo);

  }
};
