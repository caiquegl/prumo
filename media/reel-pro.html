<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f3eee6; --ink: #141210; --coral: #c45a48;
    --soft: rgba(20,18,16,.62); --dark: #12110f;
  }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
  body { font-family: Manrope, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .bg {
    position: absolute; inset: 0; background: var(--cream);
  }
  .bg img {
    width: 100%; height: 115%; object-fit: cover; object-position: center 35%;
    transform-origin: 50% 40%;
  }
  .veil {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(243,238,230,.92) 0%, rgba(243,238,230,.35) 28%, rgba(20,18,16,.55) 100%);
  }
  .veil.dark {
    background: linear-gradient(180deg, rgba(18,17,15,.75) 0%, rgba(18,17,15,.35) 40%, rgba(18,17,15,.85) 100%);
  }
  .ui {
    position: absolute; inset: 0; padding: 100px 64px 96px;
    display: flex; flex-direction: column; z-index: 3;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 26px; }
  .brand i {
    width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #111;
    display: grid; place-items: center;
  }
  .brand img { width: 100%; height: 100%; object-fit: cover; }
  .chip {
    font-size: 18px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
    color: var(--coral); background: rgba(243,238,230,.88); padding: 10px 16px; border-radius: 999px;
  }
  .kicker {
    margin-top: 42px; font-size: 20px; font-weight: 800; letter-spacing: .22em;
    text-transform: uppercase; color: var(--coral);
  }
  h1 {
    margin-top: 18px; font-family: Fraunces, Georgia, serif; font-weight: 500;
    font-size: 78px; line-height: .95; letter-spacing: -.035em; max-width: 940px;
  }
  .lead { margin-top: 20px; font-size: 30px; line-height: 1.35; max-width: 820px; color: var(--soft); font-weight: 700; }
  .rule { margin-top: 22px; height: 3px; width: 160px; background: var(--coral); transform-origin: left; }
  .mid { flex: 1; position: relative; margin-top: 28px; min-height: 700px; }
  .browser {
    position: absolute; left: 0; top: 20px; width: 700px; height: 780px;
    border-radius: 22px; overflow: hidden; background: #1c1a17;
    box-shadow: 0 48px 100px -36px rgba(0,0,0,.55);
    outline: 1px solid rgba(196,90,72,.25);
  }
  .chrome {
    height: 44px; background: #2a2622; display: flex; align-items: center; gap: 8px; padding: 0 16px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c4a574; opacity: .75; }
  .url {
    margin-left: 10px; flex: 1; height: 24px; border-radius: 8px; background: rgba(255,255,255,.08);
    color: rgba(243,238,230,.7); font-size: 14px; display: flex; align-items: center; padding: 0 12px;
  }
  .port { position: relative; height: calc(100% - 44px); overflow: hidden; }
  .port img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .phone {
    position: absolute; right: -8px; bottom: 40px; width: 320px; height: 620px;
    border-radius: 36px; overflow: hidden; background: #111; outline: 10px solid #1c1612;
    box-shadow: 0 40px 80px -24px rgba(0,0,0,.5);
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .cards {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px;
  }
  .card {
    background: rgba(255,255,255,.94); border-radius: 22px; padding: 22px 26px;
    box-shadow: 0 20px 40px -24px rgba(0,0,0,.4);
    display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center;
  }
  .card .n { font-family: Fraunces, serif; font-size: 40px; color: var(--coral); line-height: 1; }
  .card b { display: block; font-size: 28px; letter-spacing: -.02em; }
  .card span { display: block; margin-top: 2px; font-size: 22px; color: var(--soft); }
  .foot {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 18px;
  }
  .foot h2 {
    font-family: Fraunces, serif; font-weight: 500; font-size: 36px; line-height: 1.08;
    letter-spacing: -.02em; max-width: 560px;
  }
  .cta {
    display: inline-flex; align-items: center; background: #25d366; color: #0b3d1f;
    font-weight: 800; border-radius: 999px; padding: 18px 28px; font-size: 24px; white-space: nowrap;
  }
  .progress {
    position: absolute; left: 64px; right: 64px; bottom: 36px; height: 5px; z-index: 5;
    background: rgba(196,90,72,.22); border-radius: 99px; overflow: hidden;
  }
  .progress i { display: block; height: 100%; width: 0; background: var(--coral); }
  .theme-dark .brand, .theme-dark h1, .theme-dark .foot h2 { color: var(--cream); }
  .theme-dark .lead { color: rgba(243,238,230,.72); }
  .theme-dark .chip { background: rgba(18,17,15,.7); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bg"><img id="still" alt=""><div class="veil" id="veil"></div></div>
  <div class="ui">
    <div class="top" id="top">
      <div class="brand"><i><img src="../public/ig/logo.jpg" alt=""></i>Web Prumo</div>
      <div class="chip" id="chip">REEL</div>
    </div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="rule" id="rule"></div>
    <div class="mid">
      <div class="browser" id="browser">
        <div class="chrome"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="url" id="url">webprumo.com.br</div></div>
        <div class="port"><img id="mock" alt=""></div>
      </div>
      <div class="phone" id="phone"><img id="phoneImg" alt=""></div>
      <div class="cards" id="cards"></div>
    </div>
    <div class="foot" id="foot">
      <h2 id="closer"></h2>
      <div class="cta">WhatsApp · 96633-1995</div>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script>
const DEFAULT = {
  duration: 18, theme: "cream", chip: "SITE · PME",
  kicker: "WEB PRUMO", title: "Hook", lead: "",
  closer: "Orçamento no WhatsApp.",
  still: "../public/ig/prumo-feed-02-mockup-landing.jpg",
  mock: "../public/ig/prumo-feed-22-sp-anatomia.jpg",
  phone: "../public/ig/prumo-feed-04-cta-direct.jpg",
  url: "webprumo.com.br",
  cards: [],
};
function parseCfg() {
  try {
    const raw = location.hash.slice(1);
    if (!raw) return DEFAULT;
    return { ...DEFAULT, ...JSON.parse(decodeURIComponent(raw)) };
  } catch { return DEFAULT; }
}
const cfg = parseCfg();
const $ = (id) => document.getElementById(id);
$("chip").textContent = cfg.chip;
$("kicker").textContent = cfg.kicker;
$("title").innerHTML = cfg.title;
$("lead").textContent = cfg.lead || "";
$("closer").textContent = cfg.closer;
$("url").textContent = cfg.url;
$("still").src = cfg.still;
$("mock").src = cfg.mock;
$("phoneImg").src = cfg.phone;
if (cfg.theme === "dark") {
  $("stage").classList.add("theme-dark");
  $("veil").classList.add("dark");
  $("bg").style.background = "#12110f";
}
$("cards").innerHTML = (cfg.cards || []).map((c) =>
  `<div class="card"><div class="n">${c.n || ""}</div><div><b>${c.t || ""}</b><span>${c.d || ""}</span></div></div>`
).join("");
const clamp = (v) => Math.min(1, Math.max(0, v));
const seg = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const ease = (p) => 1 - Math.pow(1 - p, 3);
const io = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
window.render = (t) => {
  const dur = cfg.duration || 18;
  $("bar").style.width = `${(t / dur) * 100}%`;
  $("top").style.opacity = 1;
  $("kicker").style.opacity = ease(seg(t, 0, 0.6));
  $("title").style.opacity = ease(seg(t, 0.2, 1.0));
  $("lead").style.opacity = ease(seg(t, 0.8, 1.6));
  $("rule").style.transform = `scaleX(${ease(seg(t, 0.4, 1.8))})`;
  const z = 1.04 + 0.08 * io(seg(t, 0, Math.min(6, dur - 2)));
  $("still").style.transform = `scale(${z}) translateY(${io(seg(t, 0, 5)) * -24}px)`;
  const lift = ease(seg(t, 2.0, 3.4));
  $("browser").style.opacity = lift;
  $("browser").style.transform = `translateY(${(1 - lift) * 80}px)`;
  const ph = ease(seg(t, 5.5, 7.0));
  $("phone").style.opacity = ph;
  $("phone").style.transform = `translateY(${(1 - ph) * 140}px)`;
  const cards = [...$("cards").children];
  cards.forEach((el, i) => {
    const p = ease(seg(t, 8.2 + i * 0.55, 9.0 + i * 0.55));
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * 28}px)`;
  });
  const f = ease(seg(t, dur - 4.2, dur - 3.0));
  $("foot").style.opacity = f;
  $("foot").style.transform = `translateY(${(1 - f) * 24}px)`;
};
window.__ready = true;
window.render(0);
</script>
</body>
</html>
