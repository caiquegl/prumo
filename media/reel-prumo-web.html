<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Reels Prumo Web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@500;600&display=swap">
<style>
:root{--bg:#f7f1e5;--t:#b5532f;--ink:#22252b;--w:#f08a5d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0d0c0e;font-family:Inter,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#stage{height:calc(100% - 70px);aspect-ratio:9/16;max-width:100%;position:relative;overflow:hidden;border-radius:14px;container-type:size;background:#1a1210}
#cam{position:absolute;inset:0;transform-origin:50% 41%;transition:transform 3s cubic-bezier(.45,0,.25,1)}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,#2b1c18 0%,#4a281c 45%,#1b1210 100%)}
.glow{position:absolute;left:55cqw;top:10cqw;width:90cqw;height:90cqw;border-radius:50%;background:radial-gradient(circle,rgba(255,170,110,.45),transparent 65%);animation:g 4s ease-in-out infinite}
@keyframes g{50%{opacity:.65;transform:scale(1.08)}}
.desk{position:absolute;left:0;right:0;top:112cqw;bottom:0;background:linear-gradient(#3a2418,#150d0a)}
.laptop{position:absolute;left:14cqw;top:50cqw;width:72cqw;height:46cqw;background:#0b0909;border:1.2cqw solid #111;border-radius:2cqw;box-shadow:0 0 14cqw rgba(255,190,140,.4);overflow:hidden}
.base{position:absolute;left:8cqw;top:97cqw;width:84cqw;height:3cqw;background:linear-gradient(#2a2523,#0e0b0a);border-radius:0 0 3cqw 3cqw}
.page,.code{position:absolute;inset:0;transition:opacity .6s}
.page{background:var(--bg);opacity:0}.code{background:#1b1717;padding:3cqw;opacity:1}
.pg .page{opacity:1}.pg .code{opacity:0}
.cl{height:1.5cqw;border-radius:1cqw;margin-bottom:1.9cqw;width:0;transition:width .7s ease}
.go .cl{width:var(--w2)}
.b{position:absolute;opacity:0;transform:translateY(2cqw);transition:.6s}
.pg.go .b{opacity:1;transform:none;transition-delay:var(--d)}
.k{background:var(--ink);border-radius:1cqw}.o{background:var(--t);border-radius:1cqw}.m{background:#cdbfa8;border-radius:1cqw}
.card{background:#fff;border:.2cqw solid #e3d6c0;border-radius:1.4cqw}
.phone{position:absolute;left:70cqw;top:92cqw;width:20cqw;height:38cqw;background:var(--bg);border:.9cqw solid #111;border-radius:3cqw;box-shadow:0 0 8cqw rgba(255,190,140,.35);opacity:0;transform:translateY(6cqw);transition:.9s .5s}
.pull .phone{opacity:1;transform:none}
.dev{position:absolute;left:-12cqw;bottom:-6cqw;width:66cqw;height:66cqw;filter:blur(.4cqw)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.65));pointer-events:none}
.grain{position:absolute;inset:0;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.8' numOctaves='2'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");opacity:.1;mix-blend-mode:overlay;pointer-events:none}
.tag{position:absolute;top:6cqw;left:0;right:0;text-align:center;font-family:'Playfair Display',Georgia,serif;font-size:5cqw;color:#f7f1e5}
.tag em{color:var(--w);font-style:normal}
.cap{position:absolute;left:7cqw;right:7cqw;bottom:13cqw;color:#f7f1e5;font-family:'Playfair Display',Georgia,serif;font-size:10cqw;line-height:1.08;text-shadow:0 .5cqw 3cqw #000}
.cap em{color:var(--w);font-style:normal}.cap small{display:block;font:500 4.4cqw Inter,Arial,sans-serif;margin-top:3cqw;opacity:.9}
.in{animation:u .8s both}@keyframes u{from{opacity:0;transform:translateY(5cqw)}}
.end{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8cqw;opacity:0;transition:opacity .8s;pointer-events:none}
.end.on{opacity:1}
.end h1{font-family:'Playfair Display',Georgia,serif;font-size:13cqw;line-height:1.05;margin:0;color:var(--ink)}.end em{color:var(--t);font-style:normal}
.logo{height:24cqw;margin-bottom:5cqw}
.btn{background:var(--t);color:#fff;font-weight:600;font-size:6.2cqw;border-radius:99px;padding:4cqw 8cqw;margin-top:7cqw;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.07)}}
.sub{font-size:5.4cqw;color:var(--ink);margin-top:5cqw;line-height:1.4}
.bar{position:absolute;left:0;top:0;height:1.2cqw;background:var(--w);width:0;z-index:5}
button{background:var(--t);color:#fff;border:0;border-radius:99px;padding:10px 22px;font:600 15px Inter,Arial,sans-serif;cursor:pointer}
</style></head><body>
