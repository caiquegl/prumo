<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Reels Web Prumo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@500;600;800&display=swap">
<style>
:root{--t:#e8703f;--ink:#f6f0e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#050505;font-family:Inter,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#stage{height:calc(100% - 70px);aspect-ratio:9/16;max-width:100%;position:relative;overflow:hidden;border-radius:14px;container-type:size;background:radial-gradient(circle at 50% 70%,#3a1d12 0%,#0f0e11 60%);color:var(--ink)}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.045) .15cqw,transparent .15cqw) 0 0/9cqw 9cqw,linear-gradient(90deg,rgba(255,255,255,.045) .15cqw,transparent .15cqw) 0 0/9cqw 9cqw}
.mq{position:absolute;top:60cqw;left:0;white-space:nowrap;font:800 34cqw Inter,Arial,sans-serif;color:transparent;-webkit-text-stroke:.25cqw rgba(255,255,255,.09);animation:m 15s linear infinite}
@keyframes m{to{transform:translateX(-60%)}}
#cam{position:absolute;inset:0;transform-origin:50% 49.5%;transition:transform 3s cubic-bezier(.45,0,.25,1)}
.glow{position:absolute;left:10cqw;top:112cqw;width:80cqw;height:20cqw;background:radial-gradient(ellipse,rgba(232,112,63,.55),transparent 70%);filter:blur(2cqw)}
.lid{position:absolute;left:11cqw;top:62cqw;width:78cqw;height:52cqw;background:linear-gradient(#26262b,#0b0b0d);border-radius:2.4cqw 2.4cqw .6cqw .6cqw;box-shadow:0 0 0 .25cqw #5b5b62,0 0 10cqw rgba(232,112,63,.25)}
.lid:before{content:"";position:absolute;left:50%;top:.8cqw;width:.7cqw;height:.7cqw;margin-left:-.35cqw;border-radius:50%;background:#2e3a4a}
.scr{position:absolute;left:2cqw;top:2cqw;width:74cqw;height:48cqw;background:#050505;overflow:hidden}
.scr img{position:absolute;left:0;top:0;width:74cqw;opacity:0;transition:opacity .5s}
.scr img.on{opacity:1;transform:translateY(calc(var(--p)*-1cqw));transition:opacity .5s,transform var(--dur) cubic-bezier(.35,0,.25,1) .2s}
.ld{position:absolute;inset:0;background:#f4f4f4;opacity:0;transition:opacity .4s}.ld.on{opacity:1}
.ld i{position:absolute;background:#dcdcdc;border-radius:1cqw}
.ld b{position:absolute;left:0;top:0;height:1cqw;width:0;background:#e0443e}.ld.on b{width:30%;transition:width 2.4s cubic-bezier(.1,.7,.2,1)}
.glass{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.14),transparent 38%,transparent 70%,rgba(255,255,255,.05));pointer-events:none}
.hinge{position:absolute;left:9cqw;top:114cqw;width:82cqw;height:1.2cqw;background:linear-gradient(#6a6a72,#3c3c42);border-radius:0 0 1cqw 1cqw}
.base{position:absolute;left:5cqw;top:115.2cqw;width:90cqw;height:14cqw;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);background:linear-gradient(#55555c,#3a3a40 70%,#2a2a2f)}
.keys{position:absolute;left:12cqw;top:2cqw;width:66cqw;height:7cqw;background:repeating-linear-gradient(90deg,#1b1b1f 0 .15cqw,transparent .15cqw 3.6cqw),repeating-linear-gradient(0deg,#1b1b1f 0 .15cqw,transparent .15cqw 1.75cqw);opacity:.7}
.ph{position:absolute;left:3cqw;top:98cqw;width:25cqw;height:50cqw;border:1cqw solid #1c1c20;border-radius:4.5cqw;overflow:hidden;background:#000;box-shadow:0 2cqw 6cqw rgba(0,0,0,.6),0 0 0 .2cqw #666;opacity:0;transform:translateY(12cqw);transition:.8s cubic-bezier(.2,.9,.3,1)}
.ph img,.cd img{width:100%;height:100%;object-fit:cover;object-position:12% 0;display:block}
.cd{position:absolute;left:62cqw;top:112cqw;width:35cqw;height:24cqw;border-radius:2.2cqw;overflow:hidden;border:.3cqw solid rgba(255,255,255,.25);box-shadow:0 2cqw 6cqw rgba(0,0,0,.6);opacity:0;transform:translateY(12cqw);transition:.8s .15s cubic-bezier(.2,.9,.3,1)}
.cd img{object-position:0 0}
.dev .ph,.dev .cd{opacity:1;transform:none;animation:bob 3s ease-in-out infinite}.dev .cd{animation-delay:-1.4s}
@keyframes bob{50%{translate:0 -1.4cqw}}
.tag{position:absolute;top:6cqw;left:0;right:0;text-align:center;font:800 4.4cqw Inter,Arial,sans-serif;letter-spacing:.9cqw;text-transform:uppercase}
.tag em{color:var(--t);font-style:normal}
.cap{position:absolute;left:7cqw;right:7cqw;top:15cqw;font:800 11.5cqw/1 Inter,Arial,sans-serif;letter-spacing:-.4cqw;text-transform:uppercase}
.cap em{color:var(--t);font-style:normal;font-family:'Playfair Display',Georgia,serif;text-transform:none;letter-spacing:0;font-weight:700}
.sub2{position:absolute;left:5cqw;right:5cqw;top:139cqw;text-align:center;font:600 4.6cqw Inter,Arial,sans-serif;display:flex;flex-wrap:wrap;gap:2cqw;justify-content:center}
.pill{background:var(--t);color:#fff;border-radius:99px;padding:2cqw 4cqw;font-weight:800;font-size:4cqw;animation:pop .5s both}
.pill.x{background:transparent;border:.4cqw solid #ff5a52;color:#ff8a84}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-8deg)}}
.in{animation:u .6s both}@keyframes u{from{opacity:0;transform:translateY(5cqw)}}
.foot{position:absolute;left:7cqw;right:7cqw;bottom:7cqw;border-top:.3cqw solid rgba(255,255,255,.25);padding-top:3.5cqw;text-align:center;font:600 4.2cqw Inter,Arial,sans-serif}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}.flash.f{animation:fl .35s}@keyframes fl{from{opacity:.75}}
.end{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#4a2415,#0f0e11 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8cqw;opacity:0;transition:opacity .6s;pointer-events:none;z-index:4}
.end.on{opacity:1}
.end h1{font:800 12.5cqw/1 Inter,Arial,sans-serif;text-transform:uppercase;margin:0;letter-spacing:-.4cqw}.end em{color:var(--t);font:700 13cqw Playfair Display,Georgia,serif;text-transform:none;font-style:normal}
.logo{height:22cqw;margin-bottom:4cqw;filter:drop-shadow(0 0 3cqw rgba(232,112,63,.5))}
.btn{background:var(--t);color:#fff;font-weight:800;font-size:6.2cqw;border-radius:99px;padding:4cqw 8cqw;margin-top:7cqw;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.07)}}
.sub{font-size:5.4cqw;margin-top:5cqw;line-height:1.5}
.bar{position:absolute;left:0;top:0;height:1.1cqw;background:var(--t);width:0;z-index:7}
button{background:#e8703f;color:#fff;border:0;border-radius:99px;padding:10px 22px;font:600 15px Inter,Arial,sans-serif;cursor:pointer}
</style></head><body>
