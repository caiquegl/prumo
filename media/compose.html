<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Manrope, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative; width: var(--w); height: var(--h);
    padding: var(--pad) 80px; display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .top { display: flex; justify-content: space-between; align-items: center;
    font-size: 26px; letter-spacing: .02em; color: var(--soft); }
  .brand { display: flex; align-items: center; gap: 14px; color: var(--ink); font-weight: 600; }
  .brand i { width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; font-style: normal; color: var(--bg); font-size: 18px;
    font-family: Fraunces, serif; }
  .title h1 { font-family: Fraunces, serif; font-weight: 500; font-size: var(--tsize);
    line-height: .95; letter-spacing: -.03em; }
  .title p { margin-top: 18px; font-size: 34px; color: var(--soft); }
  .frame {
    position: relative; width: 920px; height: 690px; border-radius: 18px; overflow: hidden;
    background: var(--panel); box-shadow: 0 40px 90px -30px rgba(0,0,0,.45);
    outline: 1px solid var(--line);
  }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform-origin: 55% 45%; }
  .scan { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--accent);
    box-shadow: 0 0 24px var(--accent); }
  .wf { position: absolute; border: 2px solid var(--line-strong); border-radius: 6px; }
  .wf.bar { border: 0; background: var(--line-strong); border-radius: 99px; }
  .meta { display: flex; justify-content: space-between; font-size: 22px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--soft); margin-top: 26px; }
  .meta b { color: var(--accent); font-weight: 700; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .foot h2 { font-family: Fraunces, serif; font-weight: 400; font-size: 58px; line-height: 1.02;
    letter-spacing: -.02em; max-width: 560px; }
  .foot p { font-size: 24px; line-height: 1.45; color: var(--soft); text-align: right; }
  .foot p strong { color: var(--ink); font-weight: 600; }

  .stack { position: relative; height: 1040px; }
  .stack .frame { position: absolute; width: 760px; height: 570px; left: 50%; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
  const cfg = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}"));
  const W = cfg.w || 1080, H = cfg.h || 1920;
  const pal = Object.assign({
    bg: "#f1ebe3", ink: "#1b1a18", soft: "rgba(27,26,24,.62)", accent: "#e0664f",
    panel: "#e9e2d8", line: "rgba(27,26,24,.12)", lineStrong: "rgba(27,26,24,.35)"
  }, cfg.pal || {});
  const root = document.documentElement.style;
  root.zoom = String(1 / (window.devicePixelRatio || 1));
  root.setProperty("--w", W + "px"); root.setProperty("--h", H + "px");
  root.setProperty("--pad", (H > 1500 ? 110 : 70) + "px");
  root.setProperty("--tsize", (H > 1500 ? 150 : 118) + "px");
  for (const [k, v] of Object.entries(pal))
    root.setProperty("--" + k.replace(/[A-Z]/g, m => "-" + m.toLowerCase()), v);

  const WF = [
    [3, 3, 94, 6],
    [4, 16, 36, 5, "bar"], [4, 23, 30, 5, "bar"], [4, 33, 34, 2.4, "bar"], [4, 38, 28, 2.4, "bar"],
    [4, 45, 16, 5],
    [46, 10, 51, 44],
    [4, 60, 24, 3, "bar"],
    [4, 68, 29.5, 29], [35.3, 68, 29.5, 29], [66.5, 68, 29.5, 29],
  ];

  const stage = document.getElementById("stage");
  const topRow = `<div class="top"><div class="brand"><i>P</i>Prumo Web</div><span>${cfg.counter || ""}</span></div>`;
  const foot = `<div class="foot"><h2>${cfg.headline || "Seu próximo site pode começar aqui."}</h2>
    <p>Orçamento no WhatsApp<br><strong>(11) 96633-1995</strong><br>@prumo264</p></div>`;

  if (cfg.mode === "story") {
    const imgs = cfg.imgs || [];
    stage.innerHTML = `${topRow}
      <div class="title"><h1>${cfg.name}</h1><p>${cfg.niche}</p></div>
      <div class="stack">${imgs.map((src, i) => `
        <div class="frame" style="top:${i * 235}px;transform:translateX(-50%) translateX(${(i - 1) * 60}px) rotate(${(i - 1) * -3}deg);z-index:${i}">
          <img src="${src}"></div>`).join("")}</div>
      ${foot}`;
    window.render = () => {};
  } else {
    stage.innerHTML = `${topRow}
      <div class="title" id="title"><h1>${cfg.name}</h1><p>${cfg.niche}</p></div>
      <div>
        <div class="frame" id="frame">
          ${WF.map(([x, y, w, h, c]) => `<div class="wf ${c || ""}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div>`).join("")}
          <img id="img" src="${cfg.img}">
          <div class="scan" id="scan"></div>
        </div>
        <div class="meta"><span><b>●</b>&nbsp; Design autoral</span><span>Do rascunho ao site no ar</span></div>
      </div>
      <div id="foot">${foot}</div>`;

    const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
    const ease = p => 1 - Math.pow(1 - p, 3);
    const io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    const $ = id => document.getElementById(id);
    const wfs = [...document.querySelectorAll(".wf")];

    window.render = t => {
      const ti = ease(seg(t, .1, 1));
      $("title").style.cssText = `opacity:${ti};transform:translateY(${(1 - ti) * 40}px)`;
      wfs.forEach((el, i) => {
        const p = io(seg(t, .5 + i * .14, 1.2 + i * .14));
        el.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`;
        el.style.opacity = 1 - seg(t, 4.2, 5);
      });
      const r = io(seg(t, 2.9, 4.6));
      const z = 1 + .035 * io(seg(t, 4.2, 9.5));
      $("img").style.clipPath = `inset(0 ${(1 - r) * 100}% 0 0)`;
      $("img").style.transform = `scale(${z})`;
      $("scan").style.left = `calc(${r * 100}% - 2px)`;
      $("scan").style.opacity = r > 0 && r < 1 ? 1 : 0;
      const fi = ease(seg(t, 5, 6));
      $("foot").style.cssText = `opacity:${fi};transform:translateY(${(1 - fi) * 30}px)`;
    };
  }
  window.render(cfg.t ?? 99);
</script>
</body>
</html>
