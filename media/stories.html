<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #f1ebe3; --ink: #1b1a18; --soft: rgba(27,26,24,.62); --accent: #e0664f; --card: #fbf8f3; --line: rgba(27,26,24,.12); }
  :root.dark { --bg: #151412; --ink: #f3eee6; --soft: rgba(243,238,230,.62); --accent: #ef7a5f; --card: #1f1d1a; --line: rgba(243,238,230,.12); }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1080px; height: 1920px; padding: 230px 80px 280px; display: flex; flex-direction: column; }
  .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .brand { position: absolute; left: 80px; top: 150px; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; }
  .brand i { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center;
    font-style: normal; color: #fff; font-size: 18px; font-family: Fraunces, serif; }
  .page { position: absolute; right: 80px; top: 152px; font-size: 24px; color: var(--soft); }
  .kicker { font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 800; margin-top: 30px; }
  h1 { font-family: Fraunces, serif; font-weight: 500; font-size: 92px; line-height: 1; letter-spacing: -.03em; margin-top: 18px; }
  .sub { margin-top: 22px; font-size: 30px; line-height: 1.38; color: var(--soft); }
  .list { margin-top: 44px; display: flex; flex-direction: column; gap: 20px; }
  .item { display: flex; gap: 24px; align-items: flex-start; background: var(--card); border: 1px solid var(--line);
    border-radius: 24px; padding: 28px 30px; box-shadow: 0 24px 60px -40px rgba(0,0,0,.35); }
  .item b { display: grid; place-items: center; flex: none; min-width: 56px; height: 56px; padding: 0 12px; border-radius: 16px;
    background: var(--accent); color: #fff; font-size: 22px; font-weight: 800; }
  .item h3 { font-size: 31px; font-weight: 700; letter-spacing: -.01em; }
  .item p { margin-top: 6px; font-size: 23px; line-height: 1.4; color: var(--soft); }
  .cta { margin-top: auto; display: flex; align-items: center; justify-content: space-between; background: var(--ink); color: var(--bg);
    border-radius: 26px; padding: 30px 36px; }
  .cta small { display: block; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; font-weight: 800; }
  .cta strong { display: block; font-family: Fraunces, serif; font-weight: 500; font-size: 52px; margin-top: 6px; }
  .cta span { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 40px; }

  .cover { background: var(--accent); color: #fff; align-items: center; justify-content: center; text-align: center; }
  .cover .brand, .cover .page { color: #fff; }
  .cover .brand i { background: #fff; color: var(--accent); }
  .disc { width: 560px; height: 560px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--ink);
    box-shadow: 0 0 0 26px rgba(255,255,255,.18); }
  .disc svg { width: 320px; height: 320px; }
  .cover h1 { font-size: 120px; margin-top: 90px; }
  .cover .sub { color: rgba(255,255,255,.85); max-width: 760px; }

  .flow { margin-top: 40px; display: flex; flex-direction: column; align-items: stretch; }
  .node { display: flex; gap: 26px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 26px 30px; }
  .node .ic { width: 74px; height: 74px; border-radius: 20px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .node .ic svg { width: 40px; height: 40px; }
  .node h3 { font-size: 34px; font-weight: 800; }
  .node p { font-size: 23px; color: var(--soft); margin-top: 4px; line-height: 1.35; }
  .node.user { background: transparent; border-style: dashed; }
  .arrow { height: 44px; display: grid; place-items: center; color: var(--accent); font-size: 32px; font-weight: 800; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const cfg = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}"));
document.documentElement.style.zoom = String(1 / (window.devicePixelRatio || 1));
if (cfg.dark) document.documentElement.classList.add("dark");

const S = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  parceria: `<svg viewBox="0 0 24 24" ${S}><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></svg>`,
  codigo: `<svg viewBox="0 0 24 24" ${S}><path d="M8 7 3 12l5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>`,
  escudo: `<svg viewBox="0 0 24 24" ${S}><path d="M12 3 20 6v6c0 4.5-3.5 8-8 9-4.5-1-8-4.5-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-4.5"/></svg>`,
  orcamento: `<svg viewBox="0 0 24 24" ${S}><path d="M4 5h16v11H9l-5 4z"/><path d="M9.5 9.5h5M9.5 12.5h3"/></svg>`,
  nuvem: `<svg viewBox="0 0 24 24" ${S}><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"/></svg>`,
  user: `<svg viewBox="0 0 24 24" ${S}><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>`,
  shieldNet: `<svg viewBox="0 0 24 24" ${S}><path d="M12 3 20 6v6c0 4.5-3.5 8-8 9-4.5-1-8-4.5-8-9V6z"/><path d="M4 11h16M12 3v18"/></svg>`,
  server: `<svg viewBox="0 0 24 24" ${S}><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></svg>`,
  db: `<svg viewBox="0 0 24 24" ${S}><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>`,
};

const topRow = `<div class="brand"><i>P</i>Prumo Web</div><div class="page">${cfg.page || ""}</div>`;
const cta = (c = ["Fale com a gente", "(11) 96633-1995"]) => `<div class="cta"><div><small>${c[0]}</small><strong>${c[1]}</strong></div><span>→</span></div>`;
const stage = document.getElementById("stage");

if (cfg.type === "cover") {
  stage.classList.add("cover");
  stage.innerHTML = `${topRow}<div class="disc">${ICONS[cfg.icon]}</div><h1>${cfg.label}</h1>${cfg.sub ? `<p class="sub">${cfg.sub}</p>` : ""}`;
} else if (cfg.type === "flow") {
  stage.innerHTML = `${topRow}<div class="kicker">${cfg.kicker}</div><h1>${cfg.title}</h1>${cfg.sub ? `<p class="sub">${cfg.sub}</p>` : ""}
    <div class="flow">${cfg.nodes.map(([ic, t, d, cls], i) => `${i ? '<div class="arrow">↓</div>' : ""}
      <div class="node ${cls || ""}"><div class="ic">${ICONS[ic]}</div><div><h3>${t}</h3><p>${d}</p></div></div>`).join("")}</div>${cta(cfg.cta)}`;
} else {
  stage.innerHTML = `${topRow}<div class="kicker">${cfg.kicker}</div><h1>${cfg.title}</h1>${cfg.sub ? `<p class="sub">${cfg.sub}</p>` : ""}
    <div class="list">${cfg.items.map(([b, t, d]) => `<div class="item"><b>${b}</b><div><h3>${t}</h3><p>${d}</p></div></div>`).join("")}</div>${cta(cfg.cta)}`;
}
</script>
</body>
</html>
