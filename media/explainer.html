<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f1ebe3; --ink: #1b1a18; --soft: rgba(27,26,24,.6); --accent: #e0664f;
    --card: #fbf8f3; --line: rgba(27,26,24,.12); --muted: rgba(27,26,24,.08);
    --ok: #2f9e6a; --bad: #d94b3d;
  }
  :root.dark {
    --bg: #151412; --ink: #f3eee6; --soft: rgba(243,238,230,.6); --accent: #ef7a5f;
    --card: #1f1d1a; --line: rgba(243,238,230,.12); --muted: rgba(243,238,230,.07);
  }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: var(--w); height: var(--h); padding: var(--pad) 80px;
    display: flex; flex-direction: column; justify-content: space-between; }
  .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: var(--soft); }
  .brand { display: flex; align-items: center; gap: 14px; color: var(--ink); font-weight: 600; }
  .brand i { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid;
    place-items: center; font-style: normal; color: #fff; font-size: 18px; font-family: Fraunces, serif; }
  .kicker { font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .head h1 { font-family: Fraunces, serif; font-weight: 500; font-size: var(--h1); line-height: 1; letter-spacing: -.03em; margin-top: 18px; }
  .head p { margin-top: 20px; font-size: 30px; line-height: 1.35; color: var(--soft); max-width: 860px; }
  .box { position: relative; width: 920px; height: var(--bh); }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .foot h2 { font-family: Fraunces, serif; font-weight: 400; font-size: var(--fh); line-height: 1.04; letter-spacing: -.02em; max-width: 560px; }
  .foot p { font-size: 24px; line-height: 1.45; color: var(--soft); text-align: right; }
  .foot p strong { color: var(--ink); font-weight: 700; }

  .card { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: 0 30px 70px -40px rgba(0,0,0,.35); padding: 28px; overflow: hidden; }
  .lbl { font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); font-weight: 700; }
  .ttl { font-family: Fraunces, serif; font-size: 40px; font-weight: 500; letter-spacing: -.01em; }
  .txt { font-size: 22px; line-height: 1.4; color: var(--soft); }
  .num { font-family: Fraunces, serif; font-weight: 500; letter-spacing: -.03em; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 99px;
    background: var(--muted); font-size: 20px; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .bar { height: 14px; border-radius: 99px; background: var(--muted); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); width: 0; }
  .check { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; display: grid;
    place-items: center; font-size: 26px; font-weight: 800; flex: none; }
  .toast { position: absolute; display: flex; align-items: center; gap: 16px; background: var(--ink); color: var(--bg);
    border-radius: 18px; padding: 20px 26px; font-size: 22px; font-weight: 600; box-shadow: 0 24px 50px -20px rgba(0,0,0,.5); }
  .toast small { display: block; font-weight: 500; opacity: .65; font-size: 18px; margin-top: 2px; }
  svg { position: absolute; inset: 0; overflow: visible; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const cfg = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}"));
const W = 1080, H = cfg.h || 1920, REEL = H > 1500;
const rs = document.documentElement.style;
rs.zoom = String(1 / (window.devicePixelRatio || 1));
rs.setProperty("--w", W + "px"); rs.setProperty("--h", H + "px");
rs.setProperty("--pad", (REEL ? 110 : 64) + "px");
rs.setProperty("--h1", (REEL ? 104 : 74) + "px");
rs.setProperty("--fh", (REEL ? 56 : 44) + "px");
rs.setProperty("--bh", (REEL ? 940 : 620) + "px");
if (cfg.dark) document.documentElement.classList.add("dark");

const clamp = v => Math.min(1, Math.max(0, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = p => 1 - Math.pow(1 - p, 3);
const io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const lerp = (a, b, p) => a + (b - a) * p;
const show = (el, p, dy = 26) => { if (!el) return; el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
const pop = (el, p) => { el.style.opacity = p; el.style.transform = `scale(${.85 + .15 * ease(p)})`; };
const br = n => n.toFixed(1).replace(".", ",");

const SCENES = {};

/* 01 — prazo */
SCENES.prazo = {
  head: ["Prazo fechado", "Seu site no ar em 7 a 15 dias.", "Escopo definido no início, prévia aprovada por você e entrega sem enrolação."],
  build: () => {
    const ms = [["Dia 1", "Briefing", "Objetivo, público e referências em uma conversa."],
                ["Dia 2–3", "Prévia aprovada", "Você vê o layout antes de uma linha de código."],
                ["Dia 4–12", "Desenvolvimento", "Código sob medida, responsivo e otimizado."],
                ["Dia 13–15", "No ar", "Domínio, HTTPS, testes e publicação."]];
    return `
      <div style="position:absolute;left:21px;top:40px;width:4px;height:720px;background:var(--line);border-radius:4px"></div>
      <div id="fill" style="position:absolute;left:21px;top:40px;width:4px;height:0;background:var(--accent);border-radius:4px"></div>
      ${ms.map(([d, t, x], i) => `
        <div class="ms" style="position:absolute;left:0;top:${i * 240 + 18}px;width:560px;display:flex;gap:34px">
          <div class="node" style="width:46px;height:46px;border-radius:50%;border:4px solid var(--line);background:var(--bg);flex:none"></div>
          <div><div class="kicker" style="font-size:20px">${d}</div>
          <div class="ttl" style="font-size:46px;margin-top:6px">${t}</div>
          <div class="txt" style="margin-top:8px">${x}</div></div>
        </div>`).join("")}
      <div class="card" id="counter" style="right:0;top:0;width:300px;height:300px;display:flex;flex-direction:column;justify-content:space-between">
        <div class="lbl">Contagem</div>
        <div><div class="txt">Dia</div><div class="num" id="day" style="font-size:150px;line-height:.9">1</div></div>
      </div>
      <div class="card" id="live" style="right:0;top:640px;width:300px;height:200px">
        <div class="lbl">Status</div>
        <div style="margin-top:22px;font-size:26px;font-weight:700;display:flex;align-items:center;gap:12px">
          <span class="dot" style="background:var(--ok)"></span>Online</div>
        <div class="txt" style="margin-top:10px;font-size:19px">https://seunegocio.com.br</div>
      </div>`;
  },
  render: t => {
    const p = io(seg(t, 1.4, 10));
    document.getElementById("fill").style.height = p * 720 + "px";
    const days = [1, 3, 12, 15], k = Math.min(2, Math.floor(p * 3)), f = p * 3 - k;
    document.getElementById("day").textContent = Math.round(p >= 1 ? 15 : lerp(days[k], days[k + 1], f));
    document.querySelectorAll(".ms").forEach((el, i) => {
      show(el, ease(seg(t, .8 + i * .25, 1.5 + i * .25)));
      el.style.opacity = .35 + .65 * (p >= i / 3 - .001 ? 1 : 0) * ease(seg(t, .8, 1.5));
      const n = el.querySelector(".node"), on = p >= i / 3 - .001;
      n.style.background = on ? "var(--accent)" : "var(--bg)";
      n.style.borderColor = on ? "var(--accent)" : "var(--line)";
    });
    show(document.getElementById("counter"), ease(seg(t, .6, 1.3)));
    pop(document.getElementById("live"), ease(seg(t, 10, 10.7)));
  },
};

/* 02 — performance (post) */
SCENES.performance = {
  head: ["Performance", "Site lento perde cliente.", "Mais da metade dos visitantes desiste de uma página que demora mais de 3 segundos."],
  build: () => `
    <div class="card" style="left:0;top:0;width:920px;height:270px">
      <div class="lbl">Tempo até a página aparecer</div>
      <div style="margin-top:30px;display:grid;grid-template-columns:170px 1fr 110px;gap:22px;align-items:center;font-size:24px;font-weight:600">
        <span style="color:var(--soft)">Site comum</span><div class="bar" style="height:30px"><i style="width:100%;background:rgba(27,26,24,.28)"></i></div><span class="num" style="font-size:38px">4,8s</span>
        <span>Site Prumo</span><div class="bar" style="height:30px"><i style="width:19%"></i></div><span class="num" style="font-size:38px;color:var(--accent)">0,9s</span>
      </div>
    </div>
    <div class="card" style="left:0;top:300px;width:290px;height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
      <div style="position:relative;width:170px;height:170px">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--muted)" stroke-width="8"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg>
        <div class="num" style="position:absolute;inset:0;display:grid;place-items:center;font-size:62px">100</div>
      </div>
      <div class="lbl">Nota de desempenho</div>
    </div>
    <div class="card" style="left:320px;top:300px;width:600px;height:320px;display:flex;flex-direction:column;justify-content:center;gap:26px">
      ${[["Imagens no formato e tamanho certos", "Nada de foto de 5 MB no topo da página."],
         ["Código enxuto, sem plugins pesados", "Só carrega o que a página realmente usa."],
         ["Hospedagem em rede global", "Servida do ponto mais perto do visitante."]].map(([a, b]) => `
        <div style="display:flex;gap:18px;align-items:flex-start"><div class="check" style="width:38px;height:38px;font-size:20px">✓</div>
        <div><div style="font-size:24px;font-weight:700">${a}</div><div class="txt" style="font-size:19px;margin-top:2px">${b}</div></div></div>`).join("")}
    </div>`,
  render: () => {},
};

/* 03 — trade marketing (reel) */
SCENES.trade = {
  head: ["Automação · Trade marketing", "Trade marketing no automático.", "Check-in na loja, foto da gôndola e relatório pronto — sem planilha."],
  build: () => {
    const colors = ["#e0664f", "#f0b44c", "#5b8def", "#2f9e6a", "#9b6bd6", "#e8e2d6"];
    let shelf = "";
    const gaps = { "0-5": 1, "2-2": 1 };
    for (let r = 0; r < 3; r++) for (let c = 0; c < 9; c++) {
      const key = `${r}-${c}`, x = 24 + c * 96, y = 70 + r * 92;
      shelf += gaps[key]
        ? `<div class="gap" style="position:absolute;left:${x}px;top:${y}px;width:84px;height:76px;border:3px dashed var(--bad);border-radius:8px;opacity:0"></div>`
        : `<div style="position:absolute;left:${x}px;top:${y + 8}px;width:84px;height:68px;border-radius:8px 8px 4px 4px;background:${colors[(r * 4 + c * 3) % 5]};opacity:.9"></div>`;
      if (c === 8) shelf += `<div style="position:absolute;left:14px;top:${y + 78}px;width:880px;height:6px;background:var(--line);border-radius:3px"></div>`;
    }
    return `
      <div class="card" id="cA" style="left:0;top:0;width:920px;height:270px;display:flex;gap:30px;padding:20px">
        <div style="position:relative;width:230px;height:230px;border-radius:16px;overflow:hidden;background:var(--muted);flex:none">
          <div style="position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:38px 38px"></div>
          <div style="position:absolute;left:30px;top:150px;width:200px;height:14px;background:var(--line);transform:rotate(-20deg)"></div>
          <div id="fence" style="position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px;border-radius:50%;border:3px solid var(--accent);background:rgba(224,102,79,.12)"></div>
          <div style="position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-26px -13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent)"></div>
        </div>
        <div style="padding-top:10px">
          <div class="lbl">Check-in · 08:31</div>
          <div class="ttl" style="margin-top:10px">Loja 214 · Mercado Central</div>
          <div class="txt" style="margin-top:6px">Promotor: Rafael S. · Rota Zona Sul</div>
          <div id="stA" class="pill" style="margin-top:22px">Localizando…</div>
        </div>
      </div>
      <div class="card" id="cB" style="left:0;top:300px;width:920px;height:380px;padding:0">
        <div style="position:absolute;left:24px;top:20px" class="lbl">Foto da gôndola</div>
        <div id="stB" class="pill" style="position:absolute;right:20px;top:12px;opacity:0;background:rgba(217,75,61,.15);color:var(--bad)">2 rupturas · preço conforme</div>
        ${shelf}
        <div id="price" style="position:absolute;left:404px;top:154px;width:100px;height:96px;border:3px solid var(--ok);border-radius:10px;opacity:0"></div>
        <div id="priceTag" class="pill" style="position:absolute;left:380px;top:258px;opacity:0;background:var(--ok);color:#fff;font-size:17px;padding:6px 12px">R$ 8,99 ✓</div>
        <div id="scan" style="position:absolute;top:56px;height:300px;width:4px;background:var(--accent);box-shadow:0 0 30px 6px rgba(224,102,79,.6);opacity:0"></div>
      </div>
      <div class="card" id="cC" style="left:0;top:710px;width:920px;height:230px">
        <div class="lbl">Relatório do gestor</div>
        <div style="margin-top:22px;display:grid;grid-template-columns:260px 1fr 90px;gap:16px 22px;align-items:center;font-size:22px;font-weight:600">
          <span>Share de gôndola</span><div class="bar"><i class="rb" data-w="34"></i></div><span class="rv" data-v="34">0%</span>
          <span>Preço conforme</span><div class="bar"><i class="rb" data-w="96"></i></div><span class="rv" data-v="96">0%</span>
          <span>Itens em ruptura</span><div class="bar"><i class="rb" data-w="8" style="background:var(--bad)"></i></div><span class="rv" data-v="2" data-unit=" SKUs">0</span>
        </div>
      </div>
      <div class="toast" id="toast" style="right:0;top:964px"><span class="dot" style="background:var(--ok)"></span>
        <div>Relatório enviado ao gestor<small>08:42 · sem digitar nada</small></div></div>`;
  },
  render: t => {
    const $ = id => document.getElementById(id);
    show($("cA"), ease(seg(t, .6, 1.3)));
    const f = seg(t, 1.4, 3.2);
    $("fence").style.transform = `scale(${.4 + .6 * ease(f)})`;
    $("fence").style.opacity = .3 + .7 * f;
    const okA = t > 3.2;
    $("stA").textContent = okA ? "✓ Dentro do raio · 38 m" : "Localizando…";
    $("stA").style.background = okA ? "var(--ok)" : "var(--muted)";
    $("stA").style.color = okA ? "#fff" : "var(--ink)";
    show($("cB"), ease(seg(t, 3.4, 4.1)));
    const s = seg(t, 4.2, 6.4);
    $("scan").style.left = 20 + s * 870 + "px";
    $("scan").style.opacity = s > 0 && s < 1 ? 1 : 0;
    document.querySelectorAll(".gap").forEach((g, i) => pop(g, ease(seg(t, 5 + i * .9, 5.5 + i * .9))));
    pop($("price"), ease(seg(t, 5.6, 6.1))); pop($("priceTag"), ease(seg(t, 5.8, 6.3)));
    pop($("stB"), ease(seg(t, 6.5, 7)));
    show($("cC"), ease(seg(t, 7.4, 8)));
    const b = io(seg(t, 8.1, 9.8));
    document.querySelectorAll(".rb").forEach(el => el.style.width = el.dataset.w * b + "%");
    document.querySelectorAll(".rv").forEach(el => el.textContent = Math.round(el.dataset.v * b) + (el.dataset.unit || "%"));
    pop($("toast"), ease(seg(t, 10, 10.6)));
  },
};

/* 04 — painel trade (post) */
SCENES.painel = {
  head: ["Sistema autoral", "Painel de trade marketing.", "Ruptura, share de gôndola e preço por loja — em tempo real, para decidir rápido."],
  build: () => {
    const kpi = [["Share de gôndola", "34%", "+3,1 pp"], ["Ruptura", "6,2%", "−1,4 pp"], ["Lojas visitadas", "128/140", "91%"], ["Preço médio", "R$ 8,79", "meta R$ 8,99"]];
    const reg = [["Norte", 9.8], ["Sul", 4.1], ["Leste", 6.7], ["Oeste", 5.2], ["Centro", 3.4]];
    const prom = [["Rafael S.", 98], ["Juliana M.", 94], ["Diego A.", 91], ["Carla T.", 87], ["Bruno L.", 82]];
    return `
      ${kpi.map(([a, b, c], i) => `<div class="card" style="left:${i * 235}px;top:0;width:215px;height:160px;padding:22px">
        <div class="lbl" style="font-size:14px">${a}</div><div class="num" style="font-size:44px;margin-top:14px">${b}</div>
        <div style="font-size:17px;font-weight:700;color:${i === 1 ? "var(--ok)" : "var(--accent)"};margin-top:6px">${c}</div></div>`).join("")}
      <div class="card" style="left:0;top:185px;width:540px;height:435px">
        <div class="lbl">Ruptura por região</div>
        <div style="position:absolute;left:30px;right:30px;bottom:70px;top:90px;display:flex;align-items:flex-end;gap:28px">
          ${reg.map(([n, v]) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px">
            <span style="font-size:18px;font-weight:700">${br(v)}%</span>
            <div style="width:100%;height:${v * 24}px;border-radius:10px 10px 4px 4px;background:${v > 6 ? "var(--accent)" : "var(--muted)"};${v > 6 ? "" : "outline:1px solid var(--line)"}"></div></div>`).join("")}
        </div>
        <div style="position:absolute;left:30px;right:30px;bottom:28px;display:flex;gap:28px">
          ${reg.map(([n]) => `<span style="flex:1;text-align:center;font-size:17px;color:var(--soft)">${n}</span>`).join("")}</div>
      </div>
      <div class="card" style="left:565px;top:185px;width:355px;height:435px">
        <div class="lbl">Top promotores</div>
        <div style="margin-top:24px;display:flex;flex-direction:column;gap:22px">
          ${prom.map(([n, v], i) => `<div><div style="display:flex;justify-content:space-between;font-size:19px;font-weight:600">
            <span>${i + 1}. ${n}</span><span>${v}</span></div>
            <div class="bar" style="height:8px;margin-top:8px"><i style="width:${v}%"></i></div></div>`).join("")}
        </div>
      </div>`;
  },
  render: () => {},
};

/* 05 — lead flow (reel) */
SCENES.lead = {
  head: ["Automação de vendas", "Do formulário ao fechamento em segundos.", "O contato chega no WhatsApp, entra no CRM e recebe resposta — sozinho."],
  build: () => {
    const field = (id, label, h = 64) => `<div style="margin-top:20px"><div class="lbl" style="font-size:15px">${label}</div>
      <div style="margin-top:8px;height:${h}px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:16px 18px;font-size:22px;font-weight:600" id="${id}"></div></div>`;
    const dest = [["WhatsApp da empresa", "Novo lead: Marina", "“Quero um site para minha clínica.”"],
                  ["CRM", "Marina → Novo contato", "Origem: site · Prioridade: alta"],
                  ["Planilha de leads", "+1 linha adicionada", "Marina · (11) 9•••• · Clínica"]];
    return `
      <div class="card" id="form" style="left:0;top:0;width:430px;height:600px">
        <div class="ttl" style="font-size:34px">Peça seu orçamento</div>
        ${field("fName", "Nome")}${field("fTel", "WhatsApp")}${field("fMsg", "Mensagem", 110)}
        <div id="send" style="margin-top:26px;height:64px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:700">Enviar</div>
      </div>
      <svg width="920" height="940">${[100, 300, 500].map((y, i) => `<path id="p${i}" d="M430 545 C 470 545, 450 ${y}, 500 ${y}" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 8"/>`).join("")}</svg>
      ${[0, 1, 2].map(i => `<div class="pk" style="position:absolute;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent);opacity:0"></div>`).join("")}
      ${dest.map(([a, b, c], i) => `<div class="card dst" style="left:500px;top:${i * 200 + 10}px;width:420px;height:180px;padding:22px 26px">
